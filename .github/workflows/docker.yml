name: Build and Test Docker
on:
  push:
    branches:
      - main
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t latihan-devops-app:v1 .
      - name: Run Container Test
        run: docker run --rm latihan-devops-app:v1
